<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal & Analytics</title>
    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e2738;
            --accent-color: #3b82f6;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --win-color: #10b981;
            --loss-color: #ef4444;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            margin-bottom: 15px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .text-win { color: var(--win-color); }
        .text-loss { color: var(--loss-color); }

        .form-container, .table-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .form-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 5px;
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        button:active {
            opacity: 0.9;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: normal;
        }

        .delete-btn {
            background: transparent;
            color: var(--loss-color);
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Trading Journal</h1>

    <!-- Analytics Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Trades</div>
            <div class="stat-value" id="total-trades">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Win Rate</div>
            <div class="stat-value" id="win-rate">0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Net P&L ($)</div>
            <div class="stat-value" id="net-pnl">$0.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Profit Factor</div>
            <div class="stat-value" id="profit-factor">0.00</div>
        </div>
    </div>

    <!-- Trade Entry Form -->
    <div class="form-container">
        <h2>Add Trade</h2>
        <form id="trade-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="pair">Asset / Pair</label>
                    <input type="text" id="pair" placeholder="e.g. XAUUSD / BTCUSD" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="BUY">BUY</option>
                        <option value="SELL">SELL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pnl">P&L ($)</label>
                    <input type="number" step="0.01" id="pnl" placeholder="e.g. 50 or -30" required>
                </div>
            </div>
            <button type="submit">Save Trade</button>
        </form>
    </div>

    <!-- Trades Table -->
    <div class="table-container">
        <h2>Trade History</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Pair</th>
                        <th>Type</th>
                        <th>P&L ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="trades-list">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let trades = JSON.parse(localStorage.getItem('trading_journal_trades')) || [];

        const form = document.getElementById('trade-form');
        const tradesList = document.getElementById('trades-list');

        function updateUI() {
            tradesList.innerHTML = '';
            
            let totalWinPnl = 0;
            let totalLossPnl = 0;
            let wins = 0;
            let losses = 0;
            let netPnl = 0;

            trades.forEach((trade, index) => {
                const pnl = parseFloat(trade.pnl);
                netPnl += pnl;

                if (pnl > 0) {
                    totalWinPnl += pnl;
                    wins++;
                } else if (pnl < 0) {
                    totalLossPnl += Math.abs(pnl);
                    losses++;
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${trade.date}</td>
                    <td>${trade.pair}</td>
                    <td style="color: ${trade.type === 'BUY' ? 'var(--win-color)' : 'var(--loss-color)'}">${trade.type}</td>
                    <td class="${pnl >= 0 ? 'text-win' : 'text-loss'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
                    <td><button class="delete-btn" onclick="deleteTrade(${index})">X</button></td>
                `;
                tradesList.appendChild(row);
            });

            const totalTrades = trades.length;
            const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;
            const profitFactor = totalLossPnl > 0 ? (totalWinPnl / totalLossPnl).toFixed(2) : (totalWinPnl > 0 ? 'INF' : '0.00');

            document.getElementById('total-trades').innerText = totalTrades;
            document.getElementById('win-rate').innerText = `${winRate}%`;
            
            const netPnlElem = document.getElementById('net-pnl');
            netPnlElem.innerText = `${netPnl >= 0 ? '+' : ''}$${netPnl.toFixed(2)}`;
            netPnlElem.className = `stat-value ${netPnl >= 0 ? 'text-win' : 'text-loss'}`;
            
            document.getElementById('profit-factor').innerText = profitFactor;

            localStorage.setItem('trading_journal_trades', JSON.stringify(trades));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const pair = document.getElementById('pair').value.toUpperCase();
            const type = document.getElementById('type').value;
            const pnl = parseFloat(document.getElementById('pnl').value);
            const date = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

            trades.unshift({ pair, type, pnl, date });
            updateUI();

            form.reset();
        });

        function deleteTrade(index) {
            trades.splice(index, 1);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
